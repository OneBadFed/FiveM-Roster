<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  /* ════════════════════════════════════════════════════════════════════
     SETTINGS STUDIO v3 — macOS dark
     Content #1e1e1e · sidebar is LIGHTER and translucent · never #000.
     Depth = material + value steps + .5px hairlines. No borders, no glows.
     Type: system font. 13 body / 12.5 controls / 11.5 caption / 11 meta.
     Colour: .9 / .55 / .38 white. ONE accent (#0a84ff) = selection + primary.
     Amber = attention, red = destructive, green = healthy. Nothing else.
     Controls: 24px fields, 22px buttons, 28px nav rows. 6px radii.
     ════════════════════════════════════════════════════════════════════ */
  :root{
    --bg:#1e1e1e;
    --panel:rgba(255,255,255,.04);
    --panel-2:rgba(255,255,255,.055);
    --field:rgba(0,0,0,.24);
    --field-f:rgba(0,0,0,.3);
    --ctl:rgba(255,255,255,.08);
    --ctl-h:rgba(255,255,255,.12);
    --hair:rgba(255,255,255,.08);
    --hairline:0 0 0 .5px rgba(255,255,255,.09) inset;
    --fieldring:0 0 0 .5px rgba(255,255,255,.15) inset;
    --ctlring:0 0 0 .5px rgba(255,255,255,.1) inset;
    --btn:linear-gradient(180deg,#4a4a4e,#3c3c40);
    --btnring:0 0 0 .5px rgba(255,255,255,.16) inset,0 1px 1.5px rgba(0,0,0,.28);
    --blue:linear-gradient(180deg,#0f8cff,#0a7ae8);
    --bluering:0 .5px 0 rgba(255,255,255,.22) inset,0 1px 2px rgba(0,0,0,.28);
    --focus:0 0 0 .5px #0a84ff inset,0 0 0 3px rgba(10,132,255,.32);
    --txt:rgba(255,255,255,.9);
    --txt-2:rgba(255,255,255,.55);
    --txt-3:rgba(255,255,255,.38);
    --accent:#0a84ff; --accent-2:#4aa8ff; --accent-soft:rgba(10,132,255,.16);
    --green:#30d158; --green-soft:rgba(48,209,88,.14);
    --amber:#ff9f0a; --amber-soft:rgba(255,159,10,.13);
    --red:#ff453a;   --red-soft:rgba(255,69,58,.14);
    --purple:#bf5af2; --purple-soft:rgba(191,90,242,.14);
    --cyan:#64d2ff;  --cyan-soft:rgba(100,210,255,.13);
    --sh-1:0 1px 1.5px rgba(0,0,0,.24);
    --sh-2:0 2px 6px rgba(0,0,0,.3);
    --sh-3:0 14px 40px -6px rgba(0,0,0,.72),0 2px 8px rgba(0,0,0,.5);
    --hi:none;
    --ease:cubic-bezier(.2,.7,.2,1); --t:120ms;
    --r-in:6px; --r-card:9px;
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace;
    --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{color:var(--txt);font-family:var(--ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;background:var(--bg);}
  .mono{font-family:var(--mono);}
  ::-webkit-scrollbar{width:15px;height:15px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:8px;border:4px solid transparent;background-clip:padding-box;min-height:36px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.34);background-clip:padding-box;border:4px solid transparent;}
  ::-webkit-scrollbar-track{background:transparent;}
  button{font-family:inherit;}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-in);}
  svg{display:block;}

  .app{display:grid;grid-template-columns:218px 1fr;height:100vh;}

  /* ─── sidebar: lighter than content, translucent ─── */
  .side{display:flex;flex-direction:column;
        background:rgba(48,48,52,.78);backdrop-filter:blur(42px) saturate(180%);-webkit-backdrop-filter:blur(42px) saturate(180%);
        border-right:1px solid rgba(0,0,0,.42);}
  .brand{display:flex;align-items:center;gap:9px;padding:14px 12px 10px 14px;}
  .brand .badge{width:28px;height:28px;border-radius:7px;background:linear-gradient(180deg,#3a3a3e,#2c2c30);color:rgba(255,255,255,.72);
        display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 0 0 .5px rgba(255,255,255,.14) inset,0 1px 2px rgba(0,0,0,.35);}
  .brand .badge svg{width:15px;height:15px;stroke-width:1.6;}
  .brand b{font-size:13px;font-weight:600;letter-spacing:0;display:block;line-height:1.3;color:rgba(255,255,255,.88);}
  .brand small{font-size:11px;font-weight:400;color:var(--txt-3);text-transform:none;letter-spacing:0;}
  .searchw{position:relative;margin:0 10px 8px;}
  .searchw .mag{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:12px;height:12px;color:rgba(255,255,255,.45);pointer-events:none;stroke-width:2.1;}
  .searchw input{width:100%;height:24px;background:rgba(255,255,255,.06);border:none;color:var(--txt);border-radius:var(--r-in);padding:0 9px 0 26px;
        font-size:12.5px;font-family:inherit;outline:none;box-shadow:var(--ctlring);transition:box-shadow var(--t);}
  .searchw input::placeholder{color:var(--txt-3);}
  .searchw input:focus{background:rgba(0,0,0,.24);box-shadow:var(--focus);}
  .nav{flex:1 1 0;min-height:0;overflow-y:auto;padding:0 10px 6px;}
  .ngroup{font-size:11px;font-weight:600;color:var(--txt-3);text-transform:none;letter-spacing:0;padding:14px 8px 6px;}
  .nav>.ngroup:first-child{padding-top:6px;}
  .nitem{display:flex;align-items:center;gap:8px;width:100%;height:28px;text-align:left;background:none;border:none;color:var(--txt);
         border-radius:var(--r-in);padding:0 8px;margin-bottom:1px;font-size:13px;font-weight:400;cursor:pointer;position:relative;
         transition:background var(--t);}
  .nitem::before{display:none;}
  .nitem:hover{background:rgba(255,255,255,.06);}
  .nitem.active{background:var(--blue);color:#fff;font-weight:500;box-shadow:var(--bluering);}
  /* icon: bare 15px glyph, same stroke vocabulary as the content area — no tile */
  .nitem .nico{width:15px;height:15px;border-radius:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
        color:rgba(255,255,255,.52);background:none;box-shadow:none;transition:color var(--t);}
  .nitem.active .nico{color:#fff;background:none;box-shadow:none;}
  .nitem .nico svg{width:15px;height:15px;stroke-width:1.7;}
  .nitem .nl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nitem .ndot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:none;opacity:0;transform:none;transition:opacity var(--t);flex:0 0 auto;}
  .nitem.active .ndot{background:#fff;}
  .nitem.dirty .ndot{opacity:1;}
  .nitem .nhits{font-size:10.5px;font-weight:500;font-family:var(--mono);color:var(--txt-2);background:none;border-radius:0;padding:0;display:none;box-shadow:none;}
  .nitem.active .nhits{color:rgba(255,255,255,.75);}
  .nitem.hashits .nhits{display:inline-block;}
  .sfoot{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(0,0,0,.28);}
  .pill{font-size:10.5px;font-weight:400;color:var(--txt-3);background:none;padding:0 2px;border-radius:0;letter-spacing:0;box-shadow:none;
        display:inline-flex;align-items:center;gap:5px;}
  .pill svg{width:10px;height:10px;flex:0 0 auto;opacity:.7;}
  .reload{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--ctl);border:none;color:var(--txt);border-radius:var(--r-in);
          height:24px;padding:0 10px;font-size:12.5px;font-weight:400;cursor:pointer;box-shadow:var(--ctlring),var(--sh-1);transition:background var(--t);}
  .reload:hover{background:var(--ctl-h);}
  .reload:active{background:rgba(255,255,255,.16);}
  .reload svg{width:12px;height:12px;stroke-width:1.9;}

  /* ─── content ─── */
  .main{min-width:0;position:relative;background:var(--bg);}
  .content{height:100vh;overflow-y:auto;padding:24px 26px 96px;}
  .ph{margin-bottom:20px;animation:none;}
  .ph h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2;color:rgba(255,255,255,.93);}
  .ph .pdesc{margin:7px 0 0;font-size:12.5px;color:var(--txt-2);max-width:64ch;line-height:1.6;font-weight:400;text-wrap:pretty;}
  .ph-top{display:flex;align-items:flex-start;gap:12px;}
  .ph-tx{min-width:0;}
  .ph-ico{width:34px;height:34px;flex:0 0 auto;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-top:2px;
        color:rgba(255,255,255,.6);background:rgba(255,255,255,.06);box-shadow:0 0 0 .5px rgba(255,255,255,.11) inset;}
  .ph-ico svg{width:17px;height:17px;stroke-width:1.7;}
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  /* Only while .switched is on the container — the nav handler adds it, then takes it off once the
     entrance is done, so a re-render caused by typing in the search box never animates. The stagger
     stops at the third child: past that it stops reading as assembly and starts reading as lag. */
  #content.switched>*{animation:rise .22s var(--ease) both;}
  #content.switched>*:nth-child(2){animation-delay:.03s;}
  #content.switched>*:nth-child(n+3){animation-delay:.06s;}

  /* Square at the top: a callout spans the card edge to edge directly under the header, so a radius
     there leaves two notches against the card's straight sides. */
  .card>.callout{border-top-left-radius:0;border-top-right-radius:0;}
  .callout{background:var(--amber-soft);border-radius:var(--r-card);padding:10px 13px;margin-bottom:16px;
        font-size:11.5px;color:#ffb340;line-height:1.55;box-shadow:0 0 0 .5px rgba(255,159,10,.24) inset;animation:none;}
  .callout.err{background:var(--red-soft);color:#ff6961;box-shadow:0 0 0 .5px rgba(255,69,58,.26) inset;}
  /* Only a TAGGED title is a heading. The old rule block-ified every <b> in a callout, and several of
     these use <b> for inline emphasis mid-sentence — which is what broke Activity, Leave engine and
     Ranks into one word per line. */
  .callout b{font-weight:600;color:rgba(255,255,255,.9);}
  .callout b.ct{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;font-weight:600;opacity:.85;color:inherit;}
  .callout .mono{font-size:10.5px;opacity:.9;}

  /* card → grouped panel. Label sits ABOVE the box, macOS-style. */
  .card{background:var(--panel);border-radius:var(--r-card);box-shadow:var(--hairline);margin-bottom:18px;padding:0 0 4px;
        position:relative;overflow:visible;animation:none;transition:none;}
  .card:hover{box-shadow:var(--hairline);}
  .card::after{display:none;}
  .card-h{display:flex;align-items:center;gap:9px;margin-bottom:0;padding:10px 14px 9px;border-bottom:1px solid var(--hair);}
  .card-h .cico{width:16px;height:16px;border-radius:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
        color:rgba(255,255,255,.5);background:none;box-shadow:none;}
  .card-h .cico svg{width:15px;height:15px;stroke-width:1.7;}
  .card-h b{font-size:13px;font-weight:600;letter-spacing:0;color:rgba(255,255,255,.88);}
  .card-h small{margin-left:auto;font-size:10.5px;font-family:var(--mono);color:var(--txt-3);letter-spacing:0;}
  .card>.grid2,.card>.stgrid,.card>.gtbl,.card>.rkgrid,.card>.ovcard,.card>.ovadd,.card>.rlhead,.card>.rlrow,
  .card>.pv-lbl,.card>.pv,.card>.dcwrow,.card>.dcsec,.card>.dcst,.card>.dcev,.card>.tagrow,.card>.fmtex,.card>.gtadd,.card>.gtempty,.card>.dcseg,
  /* Clears the header's border-bottom. The inline -8px these carried pulled them UP over that rule,
     which drew a line straight through the first line of the text. */
  .card>.sdesc{margin:12px 14px 14px;}
  .card>.grid2,.card>.stgrid,.card>.gtbl,.card>.rkgrid{margin-top:14px;margin-bottom:14px;}

  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px 26px;}
  /* A column, so the control can be pinned to the BOTTOM of the cell. Grid stretches every cell to the row
     height already; what broke alignment is .sdesc being clamped to AT MOST two lines — a one-line
     description lifted its control ~17px above its two-line neighbours. */
  .setting{min-width:0;position:relative;display:flex;flex-direction:column;}
  .setting.hide{display:none;}
  .setting .slab{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;letter-spacing:0;margin-bottom:3px;color:rgba(255,255,255,.88);
        min-height:19px;white-space:nowrap;overflow:hidden;}
  .slab-ico{display:inline-flex;color:var(--txt-3);flex:0 0 auto;transition:color var(--t);}
  .slab-ico svg{width:13px;height:13px;stroke-width:1.7;}
  .setting:focus-within .slab-ico,.setting.mod .slab-ico{color:var(--accent-2);}
  .moddot{position:absolute;left:-10px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:none;opacity:0;transform:none;transition:opacity var(--t);}
  .setting.mod .moddot{opacity:1;}
  .undo{background:none;border:none;color:var(--txt-3);cursor:pointer;padding:0 2px;font-size:12px;line-height:1;opacity:0;transition:opacity var(--t),color var(--t);}
  .setting.mod .undo{opacity:.8;} .undo:hover{color:var(--txt);}
  /* The description is clamped to at most two lines, so it is given exactly two: 3em at line-height 1.5.
     A one-line help string keeps a blank second line, and every control in the grid then starts at the same
     y — not just level with its own row, but with the whole section. */
  /* Base, NOT scoped to .setting — table cards use .sdesc too and were inheriting nothing. */
  .sdesc{font-size:11.5px;color:var(--txt-3);font-weight:400;line-height:1.5;margin-bottom:8px;max-width:52ch;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  /* Only the grid cells need the fixed two-line box that keeps their controls on one line. */
  .setting .sdesc{min-height:3em;}
  .setting .serr{display:none;font-size:11px;color:#ff6961;line-height:1.45;margin-top:6px;font-weight:400;}
  .setting.modehide{display:none;}
  .setting.err .serr{display:block;}
  .setting.err .in,.setting.err .ddbtn{box-shadow:0 0 0 .5px #ff453a inset,0 0 0 3px rgba(255,69,58,.26) !important;}

  /* ─── text fields: recessed, darker than their container ─── */
  .in{width:100%;height:24px;background:var(--field);border:none;color:var(--txt);border-radius:var(--r-in);padding:0 8px;font-size:13px;font-family:inherit;
      outline:none;box-shadow:var(--fieldring);transition:box-shadow var(--t),background var(--t);}
  .in::placeholder{color:var(--txt-3);}
  .in:focus{background:var(--field-f);box-shadow:var(--focus);}
  textarea.in,.dcta,.dcta-sm{height:auto;padding:7px 8px;line-height:1.5;}
  input.in[type=number]{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;}
  /* Chromium's number stepper is an OS widget: -webkit-appearance can REMOVE it but nothing can recolour it,
     so it stays the one light-mode control in a dark panel. Removed, and replaced with our own below. */
  input[type=number]{-moz-appearance:textfield;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .numwrap{position:relative;display:block;width:100%;}
  .numwrap>input{width:100%;padding-right:23px;}
  /* Raised, like the pop-up buttons — a stepper is something you press, not a well you type into. */
  .stepper{position:absolute;right:3px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;
           width:15px;height:18px;border-radius:4px;overflow:hidden;background:var(--ctl);box-shadow:var(--ctlring);}
  .stepper button{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;padding:0;
                  border:none;background:none;color:var(--txt-2);cursor:pointer;
                  transition:background var(--t),color var(--t);}
  .stepper button:hover{background:var(--ctl-h);color:var(--txt);}
  .stepper button:active{background:var(--accent);color:#fff;}
  /* Positive inset offset = hairline at the TOP of the lower half. A negative one would draw it at the
     BOTTOM of the upper half, which is a different pixel and the wrong edge. */
  .stepper button+button{box-shadow:0 .5px 0 rgba(255,255,255,.13) inset;}
  .stepper svg{width:7px;height:7px;pointer-events:none;}
  /* The two narrow contexts: the wrapper takes the width the bare input used to have. */
  .strow .numwrap{width:70px;flex:0 0 auto;}
  .strow .numwrap .in{width:100%;}
  .lstep .numwrap{width:56px;}
  .lstep .numwrap input{width:100%;padding-right:17px;}
  .lstep .stepper{width:13px;height:15px;right:2px;border-radius:3px;}
  .lstep .stepper svg{width:6px;height:6px;}

  /* ─── pop-up button + menu ─── */
  .ddbtn{display:flex;align-items:center;gap:8px;width:100%;height:24px;text-align:left;background:var(--btn);border:none;color:var(--txt);
      border-radius:var(--r-in);padding:0 4px 0 9px;font-size:12.5px;font-weight:400;cursor:pointer;box-shadow:var(--btnring);transition:none;}
  .ddbtn:hover{background:linear-gradient(180deg,#55555a,#45454a);transform:none;box-shadow:var(--btnring);}
  .ddbtn:active{transform:none;background:linear-gradient(180deg,#5c5c62,#4c4c52);}
  .ddbtn.open{background:var(--btn);box-shadow:var(--btnring),var(--focus);}
  .ddbtn .ddlab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* ddph, not ph: .ph is the PAGE HEADER block and carries margin-bottom:20px, which this label was
     inheriting — a 20px margin on a flex item in a 24px centred button lifts its text 10px. */
  .ddbtn .ddlab.ddph{color:var(--txt-3);font-weight:400;}
  /* the chevron gets the accent chip, as on a real NSPopUpButton */
  .ddbtn svg{width:9px;height:9px;color:#fff;flex:0 0 auto;transition:none;box-sizing:content-box;padding:3.5px;border-radius:4px;background:var(--blue);}
  .ddbtn.open svg{transform:none;}
  .ddmenu{position:fixed;z-index:60;min-width:190px;max-height:300px;overflow-y:auto;background:rgba(58,58,62,.96);
      backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border-radius:8px;padding:4px;
      box-shadow:0 0 0 .5px rgba(255,255,255,.16),var(--sh-3);animation:ddin .12s var(--ease) both;}
  @keyframes ddin{from{opacity:0;transform:scale(.99);}to{opacity:1;transform:none;}}
  .ddmenu .ddq{width:calc(100% - 4px);height:22px;margin:2px 2px 5px;background:rgba(0,0,0,.26);border:none;color:var(--txt);border-radius:5px;
      padding:0 8px;font-size:12px;font-family:inherit;outline:none;box-shadow:0 0 0 .5px rgba(255,255,255,.13) inset;}
  .ddopt{display:flex;align-items:center;gap:8px;width:100%;height:22px;text-align:left;background:none;border:none;color:var(--txt);border-radius:5px;
      padding:0 10px;font-size:12.5px;font-weight:400;cursor:pointer;transition:none;}
  .ddopt:hover,.ddopt.kb{background:var(--blue);color:#fff;}
  .ddopt.sel{color:var(--txt);}
  .ddopt .chk{width:11px;height:11px;color:currentColor;opacity:0;flex:0 0 auto;stroke-width:2.4;}
  .ddopt.sel .chk{opacity:1;}
  .ddopt .ol{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ddempty{padding:9px;font-size:11.5px;color:var(--txt-3);text-align:center;}

  /* ─── switch ─── */
  .tgl{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
  .tgl input{position:absolute;opacity:0;width:0;height:0;}
  .tgl .tr{width:38px;height:22px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;flex:0 0 auto;
      box-shadow:0 0 0 .5px rgba(255,255,255,.09) inset;transition:background var(--t);}
  .tgl .tr::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
      box-shadow:0 1px 2.5px rgba(0,0,0,.4),0 0 0 .5px rgba(0,0,0,.06);transition:transform 160ms var(--ease);}
  .tgl input:checked+.tr{background:var(--blue);box-shadow:0 .5px 0 rgba(255,255,255,.2) inset;}
  .tgl input:checked+.tr::after{transform:translateX(16px);}
  .tgl input:focus-visible+.tr{box-shadow:var(--focus);}
  .tgl .tv{font-size:12.5px;color:var(--txt-2);font-weight:400;min-width:22px;}

  /* ─── colour well ─── */
  .cwrap{display:flex;align-items:center;gap:8px;}
  .cwrap .cswatch{width:24px;height:24px;border-radius:5px;flex:0 0 auto;position:relative;cursor:pointer;
      box-shadow:0 0 0 .5px rgba(255,255,255,.22) inset,0 0 0 2px rgba(0,0,0,.28);transition:none;}
  .cwrap .cswatch:hover{transform:none;box-shadow:0 0 0 .5px rgba(255,255,255,.34) inset,0 0 0 2px rgba(0,0,0,.28);}
  .cwrap .cswatch input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .cwrap .in{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;}

  /* ─── tokens / chips ─── */
  .chipbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .chip{display:inline-flex;align-items:center;gap:5px;height:20px;font-size:11.5px;font-weight:400;color:var(--txt);
      background:var(--ctl);padding:0 5px 0 9px;border-radius:5px;box-shadow:var(--ctlring);transition:none;animation:none;}
  .chip:hover{transform:none;box-shadow:var(--ctlring);background:var(--ctl-h);}
  .chip button{background:none;border:none;color:var(--txt-3);cursor:pointer;padding:0 2px;font-size:11px;line-height:1;border-radius:3px;transition:color var(--t);}
  .chip button:hover{color:#ff6961;}
  .chip .mv:hover{color:var(--accent-2);}
  .chip.unknown{background:var(--amber-soft);color:#ffb340;box-shadow:0 0 0 .5px rgba(255,159,10,.24) inset;}
  .chipadd{display:flex;gap:6px;width:100%;margin-top:8px;}
  .chipadd .in{flex:1;}
  .chipadd button{background:var(--ctl);border:none;color:var(--txt);border-radius:var(--r-in);height:24px;padding:0 11px;font-size:12.5px;font-weight:400;
      cursor:pointer;box-shadow:var(--ctlring),var(--sh-1);transition:background var(--t);}
  .chipadd button:hover{background:var(--ctl-h);transform:none;}
  .tchip{display:inline-flex;align-items:center;gap:5px;height:22px;font-size:12px;font-weight:400;padding:0 11px;border-radius:5px;cursor:pointer;user-select:none;
      background:var(--ctl);color:var(--txt-2);box-shadow:var(--ctlring);transition:background var(--t);}
  .tchip:hover{color:var(--txt);transform:none;background:var(--ctl-h);box-shadow:var(--ctlring);}
  .tchip.on{background:rgba(255,255,255,.16);color:#fff;font-weight:500;box-shadow:0 .5px 0 rgba(255,255,255,.14) inset,0 1px 2px rgba(0,0,0,.25);}
  .tchip.on::before{content:"";}
  .tchip.unknown{color:#ffb340;}

  /* ─── statuses ─── */
  .stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;}
  .stcard{background:var(--panel-2);border-radius:8px;padding:12px;position:relative;box-shadow:var(--hairline);transition:none;animation:none;}
  .stcard:hover{transform:none;box-shadow:var(--hairline);}
  .stcard .sthead{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .stcard .stdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--sd,rgba(255,255,255,.25));box-shadow:none;}
  .stcard .stname{flex:1;min-width:0;background:none;border:none;color:var(--txt);font-size:13px;font-weight:600;font-family:inherit;outline:none;
      padding:2px 4px;border-radius:5px;transition:background var(--t);}
  .stcard .stname:hover{background:rgba(255,255,255,.06);}
  .stcard .stname:focus{background:var(--field);box-shadow:var(--focus);}
  .stcard .stdel{width:20px;height:20px;border-radius:5px;background:none;border:none;color:var(--txt-3);cursor:pointer;display:flex;align-items:center;justify-content:center;
      opacity:0;transition:opacity var(--t),color var(--t),background var(--t);flex:0 0 auto;}
  .stcard:hover .stdel{opacity:1;}
  .stcard .stdel:hover{color:#ff6961;background:var(--red-soft);}
  .stcard .stdel svg{width:12px;height:12px;stroke-width:1.9;}
  /* kind picker = a real segmented control: one neutral raised segment, no colour coding */
  .stkind{display:flex;gap:0;margin-bottom:11px;height:22px;border-radius:var(--r-in);background:rgba(255,255,255,.06);box-shadow:var(--ctlring);overflow:hidden;}
  .stkind button{flex:1;background:none;border:none;color:var(--txt-2);font-size:11px;font-weight:400;letter-spacing:0;padding:0 2px;cursor:pointer;
      border-radius:0;transition:background var(--t),color var(--t);box-shadow:none;position:relative;}
  .stkind button+button{box-shadow:-1px 0 0 rgba(0,0,0,.3);}
  .stkind button:hover{color:var(--txt);}
  .stkind button.on,
  .stkind button[data-k="TIER"].on,.stkind button[data-k="LEAVE"].on,.stkind button[data-k="PROTECTED"].on{
      color:#fff;font-weight:500;background:rgba(255,255,255,.16);box-shadow:0 .5px 0 rgba(255,255,255,.14) inset,0 1px 2px rgba(0,0,0,.25);}
  .strow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;font-size:12px;color:var(--txt-2);font-weight:400;}
  .strow .in{width:70px;font-size:12.5px;text-align:center;font-family:var(--mono);}
  .strow .cswatch{width:22px;height:22px;border-radius:5px;position:relative;cursor:pointer;box-shadow:0 0 0 .5px rgba(255,255,255,.22) inset,0 0 0 2px rgba(0,0,0,.28);}
  .strow .cswatch input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  /* "add" affordances are buttons, not dashed drop-zones */
  .stadd{border:none;border-radius:8px;background:rgba(255,255,255,.03);box-shadow:0 0 0 .5px rgba(255,255,255,.07) inset;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:18px 14px;color:var(--txt-3);cursor:pointer;
      font-size:12.5px;font-weight:400;min-height:132px;transition:background var(--t),color var(--t);}
  .stadd:hover{color:var(--txt);background:rgba(255,255,255,.06);border-color:transparent;transform:none;}
  .stadd svg{width:17px;height:17px;opacity:.6;stroke-width:1.8;}
  .stadd small{font-size:11px;font-weight:400;color:var(--txt-3);max-width:24ch;text-align:center;line-height:1.5;}

  /* ─── overrides ─── */
  .ovcard{background:var(--panel-2);border-radius:8px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--hairline);transition:none;animation:none;}
  .ovcard:hover{box-shadow:var(--hairline);}
  .ovtop{display:flex;align-items:center;gap:8px;}
  .ovtop .ddbtn,.ovtop .in{width:auto;flex:0 1 210px;font-size:12.5px;}
  .ovtop .scopebtn{flex:0 0 auto;width:auto;min-width:88px;}
  .ovtop .stdel{margin-left:auto;width:22px;height:22px;border-radius:5px;background:none;border:none;color:var(--txt-3);cursor:pointer;
      display:flex;align-items:center;justify-content:center;transition:color var(--t),background var(--t);}
  .ovtop .stdel:hover{color:#ff6961;background:var(--red-soft);}
  .ovtop .stdel svg{width:12px;height:12px;stroke-width:1.9;}
  .ladder{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;}
  .lstep{display:inline-flex;align-items:center;gap:5px;background:var(--ctl);border-radius:5px;padding:3px 5px;box-shadow:var(--ctlring);
      transition:none;animation:none;}
  .lstep:hover{transform:none;box-shadow:var(--ctlring);}
  .lstep .ddbtn{width:auto;height:18px;background:none;box-shadow:none;padding:0 3px;font-size:12px;font-weight:500;border-radius:4px;}
  .lstep .ddbtn:hover{background:rgba(255,255,255,.1);transform:none;box-shadow:none;}
  .lstep .ddbtn svg{background:none;padding:0;width:8px;height:8px;color:var(--txt-3);}
  .lstep .ge{font-size:10.5px;color:var(--txt-3);font-weight:400;font-family:var(--mono);}
  .lstep input{width:40px;background:rgba(0,0,0,.26);border:none;color:var(--txt);border-radius:4px;padding:2px 4px;font-size:11.5px;font-family:var(--mono);
      outline:none;text-align:center;box-shadow:0 0 0 .5px rgba(255,255,255,.13) inset;}
  .lstep input:focus{box-shadow:var(--focus);}
  .lstep .lx{background:none;border:none;color:var(--txt-3);cursor:pointer;font-size:11px;padding:0 2px;transition:color var(--t);}
  .lstep .lx:hover{color:#ff6961;}
  .ladd{background:var(--ctl);border:none;color:var(--txt-2);border-radius:5px;padding:4px 10px;font-size:11.5px;font-weight:400;cursor:pointer;
      box-shadow:var(--ctlring);transition:background var(--t),color var(--t);}
  .ladd:hover{color:var(--txt);background:var(--ctl-h);border-color:transparent;}
  /* A button, matching .gtadd — full width and pale it read as another empty panel, not an action. */
  .ovadd{width:auto;height:24px;padding:0 11px;border:none;border-radius:6px;background:var(--ctl);box-shadow:var(--ctlring);
      display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--txt-2);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:400;
      transition:background var(--t),color var(--t);}
  .ovadd:hover{color:var(--txt);background:var(--ctl-h);border-color:transparent;transform:none;}
  .ovadd svg{width:11px;height:11px;stroke-width:2;}

  /* ─── generic table editor ─── */
  .gtbl{display:flex;flex-direction:column;gap:0;background:var(--panel-2);border-radius:8px;box-shadow:var(--hairline);overflow:hidden;}
  .gthead{display:grid;gap:8px;padding:7px 34px 7px 10px;font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--txt-3);
      border-bottom:1px solid var(--hair);}
  .gtrow{display:grid;gap:8px;align-items:center;animation:none;padding:5px 6px 5px 10px;}
  .gtrow+.gtrow{box-shadow:0 -.5px 0 rgba(255,255,255,.06) inset;}
  .gtc{width:100%;min-width:0;height:22px;background:rgba(0,0,0,.22);border:none;color:var(--txt);border-radius:5px;padding:0 7px;font-size:12.5px;
      font-family:inherit;outline:none;box-shadow:0 0 0 .5px rgba(255,255,255,.12) inset;transition:box-shadow var(--t),background var(--t);}
  .gtc::placeholder{color:var(--txt-3);}
  .gtc:focus{background:var(--field-f);box-shadow:var(--focus);}
  .gtdel{width:24px;height:24px;border-radius:5px;background:none;border:none;color:var(--txt-3);cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:color var(--t),background var(--t);flex:0 0 auto;}
  .gtdel:hover{color:#ff6961;background:var(--red-soft);}
  .gtdel svg{width:12px;height:12px;stroke-width:1.9;}
  /* A button, not a second empty box. Full-width and pale, it sat under the equally pale "no rows yet"
     panel and the pair read as two empty slabs rather than a list and its add control. */
  .gtadd{margin-top:8px;width:auto;height:24px;padding:0 11px;border:none;border-radius:6px;
      background:var(--ctl);box-shadow:var(--ctlring);
      display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--txt-2);cursor:pointer;
      font-family:inherit;font-size:12.5px;font-weight:400;
      transition:background var(--t),color var(--t);}
  .gtadd:hover{color:var(--txt);background:var(--ctl-h);border-color:transparent;transform:none;}
  .gtadd svg{width:11px;height:11px;stroke-width:2;}
  .gtempty{padding:14px;text-align:center;color:var(--txt-3);font-size:11.5px;}

  /* ─── previews (Discord chrome below stays Discord's own palette on purpose) ─── */
  .pv{margin-top:10px;border-radius:8px;overflow:hidden;box-shadow:var(--hairline);}
  .pv-lbl{font-size:10px;font-weight:600;color:var(--txt-3);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 7px;}
  .pv-note{font-weight:400;color:var(--txt-3);text-transform:none;letter-spacing:0;opacity:.8;}
  .dcwrap{background:#313338;padding:14px;}
  .dc-msg{font-family:var(--ui);}
  .dc-mrow{display:flex;gap:13px;align-items:flex-start;}
  .dc-av{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
  .dc-mbody{flex:1;min-width:0;}
  .dc-mhead{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
  .dc-mname{font-size:14px;font-weight:600;color:#f2f3f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dc-app{background:#5865f2;color:#fff;font-size:9px;font-weight:600;padding:1px 4px;border-radius:3px;text-transform:uppercase;letter-spacing:.02em;flex:0 0 auto;}
  .dc-mtime{font-size:10.5px;color:#949ba4;flex:0 0 auto;}
  .dc-eauth{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#f2f3f5;margin-bottom:6px;}
  .dc-eaic{width:20px;height:20px;border-radius:50%;object-fit:cover;flex:0 0 auto;}
  .dc-ebody{display:flex;gap:12px;}
  .dc-emain{flex:1;min-width:0;}
  .dc-thumb{width:64px;height:64px;border-radius:6px;object-fit:cover;flex:0 0 auto;}
  .dc-img{display:block;width:100%;max-width:340px;border-radius:6px;margin-top:10px;}
  .dc-ficon{width:18px;height:18px;border-radius:50%;object-fit:cover;flex:0 0 auto;}
  .dc-embed{background:#2b2d31;border-left:4px solid var(--accent);border-radius:4px;padding:11px 15px 13px 12px;max-width:440px;}
  .dc-title{font-size:14px;font-weight:700;color:#f2f3f5;margin-bottom:7px;line-height:1.35;}
  .dc-desc{font-size:12.5px;color:#dbdee1;line-height:1.5;word-break:break-word;}
  .dc-desc strong{font-weight:700;color:#f2f3f5;} .dc-desc em{font-style:italic;} .dc-desc u{text-decoration:underline;} .dc-desc s{text-decoration:line-through;}
  .dc-flds{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap;}
  .dc-fld{min-width:78px;} .dc-fn{font-size:11px;font-weight:700;color:#f2f3f5;margin-bottom:2px;} .dc-fv{font-size:12px;color:#dbdee1;}
  .dc-foot{font-size:10px;color:#949ba4;margin-top:11px;display:flex;align-items:center;gap:7px;}
  .dc-ic{font-family:var(--mono);font-size:11px;background:#1e1f22;color:#dbdee1;padding:1px 4px;border-radius:4px;}
  .dc-cb{font-family:var(--mono);font-size:11px;background:#1e1f22;border:1px solid #232428;border-radius:5px;padding:7px 9px;margin:5px 0;white-space:pre-wrap;color:#dbdee1;overflow-x:auto;}
  .dc-cb code{white-space:pre-wrap;font-family:inherit;}
  .dc-lk{color:#00a8fc;text-decoration:none;} .dc-lk:hover{text-decoration:underline;}
  .dc-mn{color:#c9cdfb;background:rgba(88,101,242,.3);border-radius:3px;padding:0 2px;font-weight:600;}
  .dc-em{color:#dbdee1;} .dc-tm{background:rgba(255,255,255,.06);border-radius:3px;padding:0 3px;}
  .dc-bq{border-left:3px solid #4e5058;margin:3px 0;padding:1px 0 1px 10px;color:#dbdee1;}
  .dc-hd{font-weight:700;color:#f2f3f5;margin:5px 0 2px;line-height:1.3;} .dc-hd1{font-size:16px;} .dc-hd2{font-size:14px;} .dc-hd3{font-size:12.5px;}
  .dc-st{font-size:11px;color:#949ba4;margin-top:2px;}
  .dc-ls{margin:3px 0;padding-left:22px;} .dc-ls li{margin:1px 0;}
  .dc-sp{background:#111214;border-radius:4px;color:transparent;cursor:pointer;transition:color .1s,background .1s;}
  .dc-sp:hover{background:rgba(255,255,255,.1);color:#dbdee1;}
  .pv-sheet{padding:12px;font-family:var(--mono);font-size:9.5px;}
  .pv-sheet .prow{display:flex;gap:2px;margin-bottom:2px;}
  .pv-sheet .pc1{flex:1.4;padding:5px 8px;border-radius:4px;overflow:hidden;white-space:nowrap;}
  .pv-sheet .pc2{flex:1;padding:5px 8px;border-radius:4px;text-align:center;}

  /* ─── connections / discord config ─── */
  .dcst{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:400;color:var(--txt);}
  .dcdot{width:7px;height:7px;border-radius:50%;background:#ff453a;}
  .dcdot.on{background:var(--green);box-shadow:none;}
  .dcev{margin:0;padding-left:16px;color:var(--txt-2);font-size:12.5px;line-height:1.8;}
  /* #dcwh is a direct child of .card, so nothing inside it picked up the card's 14px gutter. */
  .card>#dcwh{margin:12px 14px 14px;}
  /* Status line. The hairline is 0 -.5px inset — a NEGATIVE offset exposes the strip at the BOTTOM of the
     box, which is the edge a rule under a heading belongs on. */
  .dcwhead{display:flex;align-items:center;gap:10px;height:24px;margin-bottom:11px;padding-bottom:9px;
           box-shadow:0 -.5px 0 rgba(255,255,255,.08) inset;}
  .dcwhead .dcst{flex:1;min-width:0;font-size:12.5px;}
  .dclink{background:none;border:none;padding:0;font-family:inherit;font-size:11.5px;cursor:pointer;
          color:var(--txt-3);transition:color var(--t);flex:0 0 auto;}
  .dclink:hover{color:var(--txt);}
  .dclink.danger{color:rgba(255,105,97,.72);}
  .dclink.danger:hover{color:#ff6961;}
  .dcwrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .dcwrow .dcurl{flex:1 1 220px;min-width:160px;margin:0;font-family:var(--mono);font-size:11.5px;color:var(--txt-3);}
  .dcnote{margin-top:9px;max-width:74ch;}
  /* The opt-in switches are a LIST, not four loose rows: one grouped box, hairline between each. */
  .dcgroup{background:rgba(255,255,255,.04);border-radius:8px;box-shadow:0 0 0 .5px rgba(255,255,255,.08) inset;
           overflow:hidden;margin-top:6px;}
  .dcgroup>*+*{box-shadow:0 .5px 0 rgba(255,255,255,.07) inset;}
  .dcbtn{flex:0 0 auto;background:var(--ctl);border:none;color:var(--txt);border-radius:var(--r-in);height:24px;padding:0 11px;font-size:12.5px;font-weight:400;
         cursor:pointer;box-shadow:var(--ctlring),var(--sh-1);transition:background var(--t);}
  .dcbtn:hover{background:var(--ctl-h);transform:none;}
  .dcbtn:active{transform:none;background:rgba(255,255,255,.16);}
  .dcbtn.primary{background:var(--blue);color:#fff;font-weight:500;box-shadow:var(--bluering);}
  .dcbtn.primary:hover{background:linear-gradient(180deg,#1e95ff,#1183f0);}
  .dcbtn.danger{color:#ff6961;} .dcbtn.danger:hover{background:var(--red-soft);color:#ff6961;}
  /* #dcBuild is a direct child of .card, so nothing inside it inherited the card's gutter — same as #dcwh. */
  .card>#dcBuild{margin:12px 14px 14px;}
  /* A real segmented track: one control with N halves, not N loose chips. */
  .dcseg{display:inline-flex;flex-wrap:wrap;gap:0;align-items:center;margin:0;padding:2px;
         background:rgba(255,255,255,.06);border-radius:7px;box-shadow:var(--ctlring);}
  .dcsegb{background:none;border:none;height:22px;padding:0 11px;border-radius:5px;font-family:inherit;
          font-size:12.5px;font-weight:400;color:var(--txt-2);cursor:pointer;white-space:nowrap;
          transition:background var(--t),color var(--t);}
  .dcsegb:hover{color:var(--txt);}
  .dcsegb.on{background:var(--blue);color:#fff;font-weight:500;box-shadow:var(--bluering);}
  /* The state sentence and its two resets, scoped narrow to wide. */
  .dcstate{display:flex;align-items:center;gap:12px;margin-top:9px;font-size:11.5px;color:var(--txt-3);}
  .dcstate>span{flex:1;min-width:0;}
  /* The token row is a group of its own — the sections below start their own stack, so it needs a real
     gap under it. The markup it replaced carried margin:6px 0 12px and my rule dropped the bottom half. */
  .dctokens{margin:6px 0 16px;}
  .dctokens .rlt{font-family:var(--mono);font-size:11px;}
  .dclb{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:16px 0 0;}
  .dccnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--txt-3);text-transform:none;letter-spacing:0;font-weight:400;}
  .dcta{min-height:66px;resize:vertical;font-family:inherit;width:100%;}
  .dcta-sm{min-height:44px;resize:vertical;font-family:inherit;width:100%;}
  .dcsec{border:none;border-radius:8px;margin-bottom:6px;background:var(--panel-2);box-shadow:var(--hairline);overflow:hidden;}
  .dcsec>summary{list-style:none;cursor:pointer;padding:8px 12px;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--txt-2);
      display:flex;align-items:center;gap:7px;user-select:none;transition:background var(--t);}
  .dcsec>summary::-webkit-details-marker{display:none;}
  .dcsec>summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
      border-right:none;transform:none;transition:transform 120ms var(--ease);opacity:.55;}
  .dcsec[open]>summary::before{transform:rotate(90deg);}
  .dcsec>summary:hover{background:rgba(255,255,255,.05);}
  .dcsec-b{padding:2px 12px 12px;}
  .dctog-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 11px;height:32px;font-size:12.5px;}
  .dctog-row small{color:var(--txt-3);font-weight:400;}
  .dccolor{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .dccolin{width:110px;flex:0 0 auto;font-family:var(--mono);}
  .dcsws{display:flex;gap:5px;flex-wrap:wrap;}
  .dcsw{width:20px;height:20px;border-radius:5px;border:none;cursor:pointer;padding:0;
      box-shadow:0 0 0 .5px rgba(255,255,255,.22) inset,0 0 0 2px rgba(0,0,0,.28);transition:none;}
  .dcsw:hover{transform:none;box-shadow:0 0 0 .5px rgba(255,255,255,.4) inset,0 0 0 2px rgba(0,0,0,.28);border-color:transparent;}
  .dcfr{background:rgba(255,255,255,.045);border-radius:7px;padding:9px 11px 11px;margin-bottom:6px;box-shadow:var(--hairline);}
  .dcfr-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;margin-bottom:2px;}
  .dcfr-pv{color:var(--txt-3);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .dcfr-h .gtdel{margin-left:auto;}
  .dcfr .tgl{margin-top:7px;}
  .dcm-content{color:#dbdee1;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;margin-bottom:6px;}

  @media (prefers-reduced-motion:reduce){

  /* ── live previews ── */
  // Discord markdown → safe HTML. Escapes BEFORE building markup and only allows http(s) links, so config text can't inject HTML.
  function dcRender(src){
    var store=[];
    function keep(html){ store.push(html); return '\u0000'+(store.length-1)+'\u0001'; }
    function e(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function inl(t){
      return String(t)
        .replace(/\|\|([\s\S]+?)\|\|/g,'<span class="dc-sp">$1</span>')
        .replace(/\*\*\*([\s\S]+?)\*\*\*/g,'<strong><em>$1</em></strong>')
        .replace(/\*\*([\s\S]+?)\*\*/g,'<strong>$1</strong>')
        .replace(/__([\s\S]+?)__/g,'<u>$1</u>')
        .replace(/~~([\s\S]+?)~~/g,'<s>$1</s>')
        .replace(/(^|[^*])\*([^*\n]+?)\*/g,'$1<em>$2</em>')
        .replace(/(^|[^_])_([^_\n]+?)_/g,'$1<em>$2</em>');
    }
    var text=String(src==null?'':src).replace(/\r\n?/g,'\n');
    text=text.replace(/```(?:[a-z0-9+#.\-]{1,15}\n)?([\s\S]*?)```/gi,function(_,c){ return keep('<div class="dc-cb"><code>'+e(c.replace(/^\n+|\n+$/g,''))+'</code></div>'); });
    text=text.replace(/``([^`]+)``|`([^`\n]+)`/g,function(_,a,b){ return keep('<code class="dc-ic">'+e(a!=null?a:b)+'</code>'); });
    text=text.replace(/<a?:([a-z0-9_]{2,32}):\d+>/gi,function(_,n){ return keep('<span class="dc-em">:'+e(n)+':</span>'); });
    text=text.replace(/<@!?\d{5,25}>/g,function(){ return keep('<span class="dc-mn">@user</span>'); });
    text=text.replace(/<@&\d{5,25}>/g,function(){ return keep('<span class="dc-mn">@role</span>'); });
    text=text.replace(/<#\d{5,25}>/g,function(){ return keep('<span class="dc-mn dc-mnc">#channel</span>'); });
    text=text.replace(/<t:-?\d{1,14}(?::[tTdDfFR])?>/g,function(){ return keep('<span class="dc-tm">🕗 in a moment</span>'); });
    text=text.replace(/@(everyone|here)\b/g,function(_,w){ return keep('<span class="dc-mn">@'+w+'</span>'); });
    text=e(text);
    text=text.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,function(_,label,url){ return keep('<a class="dc-lk" href="'+url+'" target="_blank" rel="noopener noreferrer">'+inl(label)+'</a>'); });
    var lines=text.split('\n'), out=[], list=null, listOrd=false, quote=[], m;
    function fq(){ if(quote.length){ out.push('<blockquote class="dc-bq">'+quote.map(inl).join('<br>')+'</blockquote>'); quote=[]; } }
    function fl(){ if(list){ out.push('<'+(listOrd?'ol':'ul')+' class="dc-ls">'+list.map(function(x){return '<li>'+inl(x)+'</li>';}).join('')+'</'+(listOrd?'ol':'ul')+'>'); list=null; } }
    for(var i=0;i<lines.length;i++){ var ln=lines[i];
      if((m=ln.match(/^(#{1,3})\s+(.+)$/))){ fq(); fl(); out.push('<div class="dc-hd dc-hd'+m[1].length+'">'+inl(m[2])+'</div>'); continue; }
      if((m=ln.match(/^-#\s+(.+)$/))){ fq(); fl(); out.push('<div class="dc-st">'+inl(m[1])+'</div>'); continue; }
      if((m=ln.match(/^&gt;&gt;&gt;\s?([\s\S]*)$/))){ fl(); quote.push(m[1]); continue; }
      if((m=ln.match(/^&gt;\s?(.*)$/))){ fl(); quote.push(m[1]); continue; }
      if((m=ln.match(/^\s*[-*]\s+(.+)$/))){ fq(); if(list===null||listOrd){ fl(); list=[]; listOrd=false; } list.push(m[1]); continue; }
      if((m=ln.match(/^\s*\d+\.\s+(.+)$/))){ fq(); if(list===null||!listOrd){ fl(); list=[]; listOrd=true; } list.push(m[1]); continue; }
      fq(); fl(); out.push({t:inl(ln)});
    }
    fq(); fl();
    var html='';
    for(var j=0;j<out.length;j++){ var seg=out[j];
      if(typeof seg==='object'){ if(j>0 && typeof out[j-1]==='object') html+='<br>'; html+=seg.t; } else html+=seg;
    }
    for(var p2=0;p2<6 && /\u0000\d+\u0001/.test(html);p2++){ html=html.replace(/\u0000(\d+)\u0001/g,function(_,k){ return store[+k]==null?'':store[+k]; }); }
    return html;
  }

  /* ── statuses & overrides ── */
  function parseLadderStr(s){
    var steps=[], parts=String(s||'').split(',');
    for(var i=0;i<parts.length;i++){ var p=parts[i].trim(); if(!p) continue; var m=p.match(/^(.+):\s*(\d+(?:\.\d+)?)$/); if(!m) return null; steps.push({name:m[1].trim(), min:m[2]}); }

  /* Tiny Java-date-pattern subset (d/dd, MM/MMM/MMMM, yy/yyyy, h/hh/HH, mm, a) — enough to preview today. */
  function fmtExample(pat){
    var now=new Date();
    var MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var ML=['January','February','March','April','May','June','July','August','September','October','November','December'];
    var d=now.getDate(), mo=now.getMonth(), y=now.getFullYear(), H=now.getHours(), mi=now.getMinutes();
    var h12=(H%12)||12, ap=H<12?'AM':'PM', pad=function(n){ return (n<10?'0':'')+n; };
    return String(pat||'').replace(/yyyy/g,String(y)).replace(/yy/g,String(y).slice(-2))
      .replace(/MMMM/g,'\u0001').replace(/MMM/g,'\u0002').replace(/MM/g,pad(mo+1))
      .replace(/dd/g,pad(d)).replace(/d/g,String(d))
      .replace(/HH/g,pad(H)).replace(/hh/g,pad(h12)).replace(/h/g,String(h12))
      .replace(/mm/g,pad(mi)).replace(/a/g,ap)
      .replace(/\u0001/g,ML[mo]).replace(/\u0002/g,MS[mo]);
  }

  // Normalise an upload to a UNIFORM SQUARE that fits the icon area: draw the whole image CONTAINED + centred on a
  // transparent square canvas (never cropped/stretched), then compress to fit script storage while PRESERVING
  // TRANSPARENCY where possible — PNG (lossless) for simple icons, else WebP (lossy but keeps alpha) for detailed
  // gradient/photo art. Flat-white JPEG is a last resort only when the browser can't encode WebP.
  var ICON_CAP=16000; // must stay <= RANK_ICON_MAX_LEN_ on the server
  function processIcon(file, cb, errCb){
    if(file.size > 15*1024*1024){ errCb('That image is too large (max 15 MB).'); return; }
    var reader=new FileReader();
    reader.onerror=function(){ errCb('Could not read that file.'); };
    reader.onload=function(){
      var img=new Image();
      img.onerror=function(){ errCb('That file is not a readable image.'); };
      img.onload=function(){
        var render=function(S, fmt, q){
          var cv=document.createElement('canvas'); cv.width=S; cv.height=S;
          var ctx=cv.getContext('2d'); ctx.clearRect(0,0,S,S);
          if(fmt==='jpeg'){ ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,S,S); } // JPEG has no alpha → flat white behind
          var iw=img.naturalWidth||img.width||S, ih=img.naturalHeight||img.height||S;
          var scale=Math.min(S/iw, S/ih), dw=Math.max(1,Math.round(iw*scale)), dh=Math.max(1,Math.round(ih*scale));
          ctx.drawImage(img, Math.round((S-dw)/2), Math.round((S-dh)/2), dw, dh); // contain + centre
          try{
            if(fmt==='jpeg') return cv.toDataURL('image/jpeg', q);
            if(fmt==='webp'){ var w=cv.toDataURL('image/webp', q); return (w.indexOf('data:image/webp')===0)?w:null; } // null when the browser can't encode WebP (it silently returns a PNG)
            return cv.toDataURL('image/png');
          }catch(e){ return null; }
        };
        var uri=null;
        // 1) PNG (lossless, keeps transparency) — the largest size that fits. Flat / simple icons land here crisply.
        var pngS=[256,192,160,128,96];
        for(var i=0;i<pngS.length;i++){ var u=render(pngS[i],'png'); if(u && u.length<=ICON_CAP){ uri=u; break; } }
        // 2) Detailed image (gradients / photo) too big as PNG → WebP: lossy (small) but still KEEPS TRANSPARENCY.
        if(!uri){
          var wp=[[256,0.9],[256,0.82],[224,0.78],[192,0.74],[160,0.68],[128,0.6],[96,0.52]];
          for(var w=0;w<wp.length;w++){ var wu=render(wp[w][0],'webp',wp[w][1]); if(wu && wu.length<=ICON_CAP){ uri=wu; break; } }
        }
        // 3) Only if this browser can't encode WebP → JPEG (flat white behind; loses transparency), stepping down to fit.
        if(!uri){
          var jpg=[[256,0.85],[224,0.8],[192,0.72],[160,0.66],[128,0.6],[112,0.54],[96,0.48],[80,0.42],[64,0.36]];
          for(var k=0;k<jpg.length;k++){ var j=render(jpg[k][0],'jpeg',jpg[k][1]); if(j && j.length<=ICON_CAP){ uri=j; break; } }
        }
        if(!uri){ errCb('Could not read that image — please try a different file.'); return; } // only if the canvas itself failed (corrupt / cross-origin)
        cb(uri);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }

    var tc=e.target.closest('.tchip');
    if(tc){ var box=tc.closest('[data-tchips]'); var bk2=box.dataset.tchips; var cur=listOf(KV[bk2].value); var val=tc.dataset.tv;
      var has=cur.some(function(x){return x.toUpperCase()===val.toUpperCase();});
      var next=has?cur.filter(function(x){return x.toUpperCase()!==val.toUpperCase();}):cur.concat([val]);
      KV[bk2].value=next.join(', '); renderSection(); updateBar(); return; }
    var rm=e.target.closest('[data-rmc]');
    if(rm){ var box2=rm.closest('[data-chips]'); var bk3=box2.dataset.chips; var arr=listOf(KV[bk3].value); arr.splice(Number(rm.dataset.rmc),1); KV[bk3].value=arr.join(', '); renderSection(); updateBar(); return; }
    var mv=e.target.closest('[data-mvl]');
    if(mv){ var box3=mv.closest('[data-chips]'); var bk4=box3.dataset.chips; var arr2=listOf(KV[bk4].value); var ix=Number(mv.dataset.mvl); var tmp=arr2[ix-1]; arr2[ix-1]=arr2[ix]; arr2[ix]=tmp; KV[bk4].value=arr2.join(', '); renderSection(); updateBar(); return; }
    var ab=e.target.closest('[data-addbtn]');
    if(ab){ var bk5=ab.dataset.addbtn; var inp=document.querySelector('[data-addfor="'+bk5+'"]'); var nv=(inp.value||'').trim(); if(!nv) return; var arr3=listOf(KV[bk5].value); if(!arr3.some(function(x){return x.toUpperCase()===nv.toUpperCase();})) arr3.push(nv); KV[bk5].value=arr3.join(', '); renderSection(); updateBar(); return; }
    var kb=e.target.closest('[data-stk]');
    if(kb){ var si2=Number(kb.dataset.stk); TBL.STATUSES[si2][1]=kb.dataset.k; if(kb.dataset.k!=='TIER') TBL.STATUSES[si2][2]=''; renderSection(); refreshDerived(); updateBar(); return; }
    var sd=e.target.closest('[data-stdel]');
    if(sd){ TBL.STATUSES.splice(Number(sd.dataset.stdel),1); renderSection(); refreshDerived(); updateBar(); return; }
    if(e.target.closest('[data-stadd]')){ TBL.STATUSES.push(['New Status','LEAVE','','','FALSE']); renderSection(); refreshDerived(); updateBar(); return; }
    var od=e.target.closest('[data-ovdel]');
    if(od){ TBL.STATUS_OVERRIDES.splice(Number(od.dataset.ovdel),1); renderSection(); updateBar(); return; }
    if(e.target.closest('[data-ovadd]')){ var tn=tierNames(); TBL.STATUS_OVERRIDES.push(['RANK','',(tn[0]||'Active')+':5, '+(tn.slice(-1)[0]||'Inactive')+':0']); renderSection(); updateBar(); return; }
    var lx=e.target.closest('[data-lx]');
    if(lx){ var ov2=lx.closest('[data-ovi]'); var i2=Number(ov2.dataset.ovi); var steps=parseLadderStr(TBL.STATUS_OVERRIDES[i2][2])||[]; steps.splice(Number(lx.dataset.lx),1); TBL.STATUS_OVERRIDES[i2][2]=ladderStr(steps); renderSection(); updateBar(); return; }
    var la=e.target.closest('[data-laddstep]');
    if(la){ var i3=Number(la.dataset.laddstep); var steps2=parseLadderStr(TBL.STATUS_OVERRIDES[i3][2])||[]; steps2.push({name:tierNames()[0]||'Active', min:'0'}); TBL.STATUS_OVERRIDES[i3][2]=ladderStr(steps2); renderSection(); updateBar(); return; }
  });
  $('content').addEventListener('keydown',function(e){
    if(e.key==='Enter' && e.target.dataset && e.target.dataset.addfor){ e.preventDefault(); var btn=document.querySelector('[data-addbtn="'+e.target.dataset.addfor+'"]'); if(btn) btn.click(); }
  });

  boot();
</script>
</body>
</html>
