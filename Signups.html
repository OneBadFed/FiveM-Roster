<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root{
    --bg:#12151a; --card:#191d24; --card2:#1f242c; --line:#2b313b;
    --tx:#e6e9ee; --tx2:#9aa3b0; --tx3:#6f7885;
    --accent:#5f9bef; --ok:#57b85a; --warn:#e0a52c; --err:#e0574f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 Roboto,Arial,sans-serif}
  .wrap{padding:14px 16px 20px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .top h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .count{color:var(--tx2);font-size:12px}
  .spacer{flex:1}
  button{font:inherit;border-radius:6px;border:1px solid var(--line);background:var(--card2);color:var(--tx);padding:6px 11px;cursor:pointer}
  button:hover{border-color:#3a424e}
  button:disabled{opacity:.5;cursor:default}
  .primary{background:var(--accent);border-color:var(--accent);color:#0b1017;font-weight:600}
  .primary:hover{filter:brightness(1.08)}
  select{font:inherit;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-bottom:10px}
  .chead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .nm{font-weight:600;font-size:14px}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--tx2)}
  .pill.Pending{color:#f0c46a;border-color:rgba(224,165,44,.4);background:rgba(224,165,44,.10)}
  .pill.Approved{color:#8fd18f;border-color:rgba(87,184,90,.4);background:rgba(87,184,90,.10)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:6px 14px;margin-bottom:10px}
  .f{min-width:0}
  .k{color:var(--tx3);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
  .v{color:var(--tx);word-break:break-word}
  .v.mono{font-family:'Roboto Mono',Consolas,monospace;font-size:12px}
  .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:9px;border-top:1px solid var(--line)}
  .act .lbl{color:var(--tx2);font-size:12px}
  .msg{padding:22px 14px;text-align:center;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:9px}
  .msg b{color:var(--tx);display:block;margin-bottom:5px;font-size:14px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#0e1218;border:1px solid var(--line);
         padding:9px 15px;border-radius:7px;font-size:12.5px;opacity:0;transition:opacity .18s;pointer-events:none;max-width:80%}
  .toast.on{opacity:1}
  .toast.ok{border-color:rgba(87,184,90,.55)} .toast.err{border-color:rgba(224,87,79,.55)}
  .sk{height:74px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);
      background-size:200% 100%;animation:sh 1.2s infinite;border-radius:9px;margin-bottom:10px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🧾 Roster Signups</h1><span class="count" id="count"></span>
    <span class="spacer"></span>
    <button id="refresh">Refresh</button>
  </div>
  <div id="list"><div class="sk"></div><div class="sk"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
  var SLOTS = [];
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function api(ok, fail, name){ var a=Array.prototype.slice.call(arguments,3);
    google.script.run.withSuccessHandler(ok).withFailureHandler(fail||onErr).dispatch(name, a); }
  function onErr(e){ toast((e && e.message) ? e.message : 'Something went wrong.', 'err'); }
  var tt;
  function toast(m, kind){ var t=$('toast'); t.textContent=m; t.className='toast on '+(kind||''); clearTimeout(tt); tt=setTimeout(function(){ t.className='toast '+(kind||''); }, 4200); }

  function slotOptions(){
    if(!SLOTS.length) return '<option value="">No open slots</option>';
    return '<option value="">Choose an open slot…</option>' + SLOTS.map(function(s){
      return '<option value="'+s.row+'">'+esc(s.rank)+' · row '+s.row+(s.unit?(' · '+esc(s.unit)):'')+'</option>';
    }).join('');
  }

  function field(k, v){ return v ? '<div class="f"><div class="k">'+esc(k)+'</div><div class="v'+(k==='Unique ID'?' mono':'')+'">'+esc(v)+'</div></div>' : ''; }

  function card(s){
    return '<div class="card" data-row="'+s.row+'">'
      + '<div class="chead"><span class="nm">'+esc(s.name||'(no name)')+'</span>'
      + '<span class="pill '+esc(s.status)+'">'+esc(s.status)+'</span></div>'
      + '<div class="grid">'
      +   field('OOC Name', s.ooc) + field('Unique ID', s.discord) + field('Email', s.email)
      +   field('Date of Birth', s.dob) + field('Phone', s.phone) + field('Submitted', s.submitted)
      + '</div>'
      + '<div class="act"><span class="lbl">Place in</span>'
      +   '<select class="slot">'+slotOptions()+'</select>'
      +   '<button class="primary go">Approve &amp; Add</button></div>'
      + '</div>';
  }

  function render(d){
    var el=$('list');
    if(!d.linked){ $('count').textContent=''; el.innerHTML='<div class="msg"><b>No admin file linked</b>Open the Control Panel ▸ Tools and link (or create) the protected admin spreadsheet first.</div>'; return; }
    if(!d.ready){ $('count').textContent=''; el.innerHTML='<div class="msg"><b>No signup form yet</b>Run 👥 Roster ▸ 🧾 Create Roster Signup Form to create it. Responses land inside the admin file.</div>'; return; }
    SLOTS = d.slots || [];
    var list = d.signups || [];
    $('count').textContent = list.length ? (list.length+' awaiting action · '+SLOTS.length+' open slot'+(SLOTS.length===1?'':'s')) : '';
    if(!list.length){ el.innerHTML='<div class="msg"><b>Nothing to review</b>Every signup has been processed.</div>'; return; }
    el.innerHTML = list.map(card).join('');
  }

  function load(){
    $('list').innerHTML='<div class="sk"></div><div class="sk"></div>';
    api(render, function(e){ $('list').innerHTML='<div class="msg"><b>Couldn\'t load signups</b>'+esc((e&&e.message)||'')+'</div>'; }, 'cpSignupList');
  }

  document.addEventListener('click', function(e){
    if(e.target.id==='refresh'){ load(); return; }
    var go = e.target.closest ? e.target.closest('.go') : null;
    if(!go) return;
    var card = go.closest('.card'), sel = card.querySelector('.slot');
    var slotRow = Number(sel.value||0), row = Number(card.dataset.row||0);
    if(!slotRow){ toast('Pick an open slot first.','err'); return; }
    go.disabled = true; sel.disabled = true; go.textContent='Adding…';
    api(function(r){
      toast('✅ '+(r.name||'Member')+' added at row '+r.slotRow+(r.piiWritten?(' · '+r.piiWritten+' private field(s) copied'):'')+'.','ok');
      load();
    }, function(err){
      go.disabled=false; sel.disabled=false; go.textContent='Approve & Add';
      onErr(err);
    }, 'cpSignupApprove', { row: row, slotRow: slotRow });
  });

  load();
</script>
</body>
</html>
