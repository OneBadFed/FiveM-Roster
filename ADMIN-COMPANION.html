<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root{--bg:#12151a;--card:#191d24;--card2:#1f242c;--line:#2b313b;--tx:#e6e9ee;--tx2:#9aa3b0;--tx3:#6f7885;--accent:#5f9bef;--err:#e0574f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 Roboto,Arial,sans-serif}
  .wrap{padding:14px 16px 18px}
  h1{font-size:15px;margin:0 0 10px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px 13px;margin-bottom:12px}
  .nm{font-weight:600;font-size:14px;margin-bottom:9px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 14px}
  .k{color:var(--tx3);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
  .v{word-break:break-word}
  .v.mono{font-family:'Roboto Mono',Consolas,monospace;font-size:12px}
  label.lbl{display:block;color:var(--tx2);font-size:12px;margin:0 0 5px}
  select{width:100%;font:inherit;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:8px}
  .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  button{font:inherit;border-radius:6px;border:1px solid var(--line);background:var(--card2);color:var(--tx);padding:8px 14px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .primary{background:var(--accent);border-color:var(--accent);color:#0b1017;font-weight:600}
  .msg{padding:18px;text-align:center;color:var(--tx2)}
  .err{color:#f0a49e;background:rgba(224,87,79,.10);border:1px solid rgba(224,87,79,.4);border-radius:7px;padding:9px 11px;margin-bottom:10px;font-size:12.5px}
  .note{color:var(--tx3);font-size:11.5px;margin-top:9px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="msg">Loading…</div></div>
<script>
  var ROW = <?= signupRow ?>;
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function f(k,v){ return v ? '<div><div class="k">'+esc(k)+'</div><div class="v'+(k==='Unique ID'?' mono':'')+'">'+esc(v)+'</div></div>' : ''; }

  function render(d){
    var s=d.signup, slots=d.slots||[];
    var opts = slots.length
      ? '<option value="">Choose an open slot…</option>'+slots.map(function(x){ return '<option value="'+x.row+'">'+esc(x.rank)+' · row '+x.row+(x.unit?(' · '+esc(x.unit)):'')+'</option>'; }).join('')
      : '<option value="">No open slots on the roster</option>';
    $('root').innerHTML =
      '<h1>Approve signup</h1>'
      + '<div class="card"><div class="nm">'+esc(s.name||'(no name)')+'</div><div class="grid">'
      +   f('OOC Name',s.ooc)+f('Unique ID',s.discord)+f('Email',s.email)+f('Date of Birth',s.dob)+f('Phone',s.phone)
      + '</div></div>'
      + '<label class="lbl" for="slot">Place them in</label><select id="slot">'+opts+'</select>'
      + '<div class="note">Adds them to the public roster and copies their private details to the Internal Roster, then marks this signup Processed. Callsign numbering and activity are normalized by the main engine on its next refresh.</div>'
      + '<div class="row"><button id="cancel">Cancel</button><button class="primary" id="go"'+(slots.length?'':' disabled')+'>Approve &amp; Add</button></div>';
    $('cancel').onclick = function(){ google.script.host.close(); };
    $('go').onclick = go;
  }

  function go(){
    var slot = Number($('slot').value||0);
    if(!slot){ fail({message:'Pick an open slot first.'}); return; }
    $('go').disabled=true; $('go').textContent='Adding…';
    google.script.run.withSuccessHandler(function(r){
      $('root').innerHTML='<div class="msg"><b>✅ '+esc(r.name)+' added at row '+r.slotRow+'</b><br>'+(r.pii? (r.pii+' private field(s) copied to the Internal Roster.') : 'No private fields to copy.')+'<br><br>Signup marked Processed.</div>';
      setTimeout(function(){ google.script.host.close(); }, 2200);
    }).withFailureHandler(function(e){ $('go').disabled=false; $('go').textContent='Approve & Add'; fail(e); })
      .companionApprove(ROW, slot);
  }
  function fail(e){
    var d=document.createElement('div'); d.className='err'; d.textContent=(e&&e.message)||'Something went wrong.';
    $('root').insertBefore(d, $('root').firstChild.nextSibling||null);
  }

  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(function(e){ $('root').innerHTML='<div class="msg">❌ '+esc((e&&e.message)||'Could not load.')+'</div>'; })
    .companionLoad(ROW);
</script>
</body>
</html>
